```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Application Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>College Application Form</h1>
        <p class="subtitle">Apply for admission to our college</p>

        <form id="applicationForm">

            <h2>Personal Information</h2>

            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name" required>

            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" name="dob" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
            </select>

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number"
                   pattern="[0-9+() .-]{7,20}" required>

            <label for="address">Address *</label>
            <textarea id="address" name="address"
                      placeholder="Enter your address"
                      rows="3" required></textarea>

            <h2>Academic Information</h2>

            <label for="course">Select Course *</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option>B.Sc. Computer Science</option>
                <option>BCA</option>
                <option>B.Com.</option>
                <option>B.A.</option>
                <option>B.E. Computer Science</option>
                <option>B.Tech. Information Technology</option>
                <option>MCA</option>
                <option>MBA</option>
            </select>

            <label for="qualification">Highest Qualification *</label>
            <select id="qualification" name="qualification" required>
                <option value="">Select Qualification</option>
                <option>10th Standard</option>
                <option>12th Standard</option>
                <option>Diploma</option>
                <option>Undergraduate Degree</option>
                <option>Postgraduate Degree</option>
            </select>

            <label for="marks">Percentage / CGPA</label>
            <input type="text" id="marks" name="marks"
                   placeholder="Enter percentage or CGPA">

            <label for="year">Admission Year *</label>
            <select id="year" name="year" required>
                <option value="">Select Admission Year</option>
                <option>2026-2027</option>
                <option>2027-2028</option>
                <option>2028-2029</option>
            </select>

            <h2>Parent / Guardian Information</h2>

            <label for="guardian">Parent / Guardian Name</label>
            <input type="text" id="guardian" name="guardian"
                   placeholder="Enter parent or guardian name">

            <label for="guardianPhone">Guardian Phone Number</label>
            <input type="tel" id="guardianPhone" name="guardianPhone"
                   placeholder="Enter guardian phone number">

            <div class="declaration">
                <input type="checkbox" id="declaration" required>
                <label for="declaration">
                    I confirm that the information provided is correct.
                </label>
            </div>

            <button type="submit">Submit Application</button>
            <button type="reset" class="reset-btn">Clear Form</button>

        </form>

        <div id="result" role="status" aria-live="polite"></div>

        <footer>
            <p>College Admission Portal</p>
        </footer>
    </div>

</body>
</html>
```
